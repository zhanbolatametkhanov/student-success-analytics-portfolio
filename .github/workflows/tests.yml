name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install pytest==9.1.1

      - name: Compile Python sources
        run: |
          python -m compileall -q app python tests

      - name: Run regression tests
        run: |
          pytest -q

      - name: Verify critical project files
        run: |
          test -f app/streamlit_app.py
          test -f app/bootstrap.py
          test -f app/data_access.py
          test -f app/requirements.txt
          test -f data/synthetic/students.csv
          test -f data/synthetic/risk_reports/student_risk_scores.csv
          test -f tests/test_project_integrity.py
          echo '✓ Critical project files verified'
